# ── Security headers applied to all responses ─────────────────────────────────
# Add to both HTTP and HTTPS server blocks via a shared snippet.
map $sent_http_content_type $csp_policy {
  default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://clerk.gotthis.one https://*.clerk.accounts.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.clerk.accounts.dev https://clerk.gotthis.one wss://gotthis.one; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self';";
}

# ── HTTP — serves the app and is the target for certbot's ACME challenge ──────
server {
    listen 80;
    server_name gotthis.one www.gotthis.one;

    client_max_body_size 10M;

    # Certbot places ACME challenge files here during certificate issuance.
    # Keep this block on HTTP even after enabling HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Once you have a certificate, replace the blocks below with:
    #   return 301 https://$host$request_uri;
    # For now, proxy normally so the site works over HTTP in the meantime.

    # ── API ────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        add_header X-Content-Type-Options   "nosniff"          always;
        add_header X-Frame-Options          "SAMEORIGIN"       always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # ── Frontend ───────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options   "nosniff"          always;
        add_header X-Frame-Options          "SAMEORIGIN"       always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  $csp_policy        always;
    }
}

