services:

  # ── MySQL database ────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ritual_ai
      MYSQL_USER: ritual
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Schema migration (runs once, exits 0, then API starts) ───────────────────
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.migrate
    env_file: .env
    environment:
      # Use the Docker service hostname, not whatever is in .env
      DATABASE_URL: mysql://ritual:${MYSQL_PASSWORD}@mysql:3306/ritual_ai
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # ── API server ────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      NODE_ENV: production
      # Use the Docker service hostname, not whatever is in .env
      DATABASE_URL: mysql://ritual:${MYSQL_PASSWORD}@mysql:3306/ritual_ai
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # WhatsApp session must survive container restarts
      - whatsapp_auth:/app/.whatsapp-auth

  # ── Web frontend (static build served by nginx) ───────────────────────────────
  web:
    build:
      context: .
      dockerfile: artifacts/web/Dockerfile
      args:
        # Baked into the JS bundle at build time — must match CLERK_PUBLISHABLE_KEY
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped

  # ── Reverse proxy ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web

volumes:
  mysql_data:
  whatsapp_auth:
